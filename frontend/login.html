<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>登录 - MailOne</title>
  <script>
    (function() {
      const theme = localStorage.getItem('mailone_theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230b57d0'><path d='M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z'/></svg>">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-app);
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
    }
    .theme-corner-toggle {
      position: absolute;
      top: 18px;
      right: 20px;
      z-index: 10;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }
    .auth-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 34px 30px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .login-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .brand-big-icon {
      width: 52px;
      height: 52px;
      background: var(--primary);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="theme-corner-toggle">
    <button class="btn-icon" id="btn-toggle-theme" title="切换浅色/深色主题" style="border: 1px solid var(--border-color); background: var(--bg-surface);">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </div>

  <div class="login-container">
    <div class="auth-card">
      <div class="login-header">
        <div class="brand-big-icon">
          <svg class="icon" style="width:28px;height:28px;" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </div>
        <h2 id="login-title" style="color: var(--text-primary); font-size: 20px; font-weight: 700;">MailOne</h2>
        <p id="login-subtitle" style="font-size: 13px; color: var(--text-muted);">聚合多邮箱与即时推送管理面板</p>
      </div>

      <form id="auth-form" style="display: flex; flex-direction: column; gap: 16px;">
        <div class="form-group">
          <label class="form-label">管理员用户名</label>
          <input type="text" id="username" class="form-input" required autocomplete="username" placeholder="admin">
        </div>

        <div class="form-group">
          <label class="form-label">访问密码</label>
          <input type="password" id="password" class="form-input" required autocomplete="current-password" placeholder="••••••••">
        </div>

        <div class="form-group" id="totp-field" style="display: none;">
          <label class="form-label" style="color: var(--warning);">两步验证动态口令 (TOTP)</label>
          <input type="text" id="totp-code" class="form-input" placeholder="6 位动态口令" maxlength="6" style="letter-spacing: 2px; font-weight: 700;">
        </div>

        <button type="submit" class="btn-primary" id="btn-submit-login" style="width: 100%; justify-content: center; padding: 10px; margin-top: 4px; font-size: 14px;">
          登 录
        </button>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    let isInitAdminMode = false;

    function initTheme() {
      const theme = localStorage.getItem('mailone_theme') || 'light';
      applyTheme(theme);
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('mailone_theme', theme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'light' ? 'dark' : 'light';
      applyTheme(next);
      showToast(next === 'light' ? '已切换至经典浅色主题' : '已切换至深色护眼主题', 'info');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3200);
    }

    async function checkStatus() {
      try {
        const res = await fetch('/api/auth/status');
        const data = await res.json();
        if (!data.has_admin) {
          isInitAdminMode = true;
          document.getElementById('login-title').textContent = '初次运行设置';
          document.getElementById('login-subtitle').textContent = '请设置您的系统管理员账号与密码';
          document.getElementById('btn-submit-login').textContent = '创建管理员并登入';
        }
      } catch (e) {
        console.error(e);
      }
    }

    document.getElementById('btn-toggle-theme').addEventListener('click', toggleTheme);

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const totpCode = document.getElementById('totp-code').value.trim().replace(/\s+/g, '');

      if (isInitAdminMode) {
        try {
          const res = await fetch('/api/auth/init-admin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();
          if (res.ok) {
            showToast('管理员创建成功，正在跳转...', 'success');
            setTimeout(() => { window.location.href = '/'; }, 800);
          } else {
            showToast(data.detail || '创建失败', 'error');
          }
        } catch (err) {
          showToast('网络请求失败', 'error');
        }
        return;
      }

      // 正常登录
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, totp_code: totpCode || null })
        });
        const data = await res.json();
        if (res.ok) {
          if (data.is_totp_required) {
            document.getElementById('totp-field').style.display = 'flex';
            document.getElementById('totp-code').focus();
            showToast('已启用两步验证，请输入动态口令', 'info');
            return;
          }
          showToast('登录成功，正在进入...', 'success');
          setTimeout(() => { window.location.href = '/'; }, 600);
        } else {
          showToast(data.detail || '用户名或密码错误', 'error');
        }
      } catch (err) {
        showToast('登录服务不可用', 'error');
      }
    });

    initTheme();
    checkStatus();
  </script>
</body>
</html>
